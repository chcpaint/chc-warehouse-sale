<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set your password — CHC</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f3f4f6; color: #1f2937; }
        .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #fff; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.08); width: 100%; max-width: 420px; padding: 32px; }
        h1 { font-size: 20px; margin: 0 0 4px; }
        p.sub { color: #6b7280; font-size: 14px; margin: 0 0 20px; }
        label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
        input { width: 100%; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }
        button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
        button:disabled { opacity: .6; cursor: default; }
        .hint { font-size: 12px; color: #9ca3af; margin-top: 6px; }
        .msg { margin-top: 16px; font-size: 14px; padding: 10px 12px; border-radius: 8px; display: none; }
        .msg.err { display: block; background: #fef2f2; color: #b91c1c; }
        .msg.ok { display: block; background: #f0fdf4; color: #15803d; }
        a.btn { display: inline-block; margin-top: 16px; color: #2563eb; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <h1>Set your password</h1>
            <p class="sub" id="context">Choose a password to activate your account.</p>
            <form id="form">
                <label for="pw">New password</label>
                <input type="password" id="pw" autocomplete="new-password" required>
                <div class="hint">At least 8 characters, with an uppercase letter, a lowercase letter, and a number.</div>
                <label for="pw2">Confirm password</label>
                <input type="password" id="pw2" autocomplete="new-password" required>
                <button type="submit" id="submit">Set password &amp; sign in</button>
            </form>
            <div class="msg" id="msg"></div>
            <div id="done" style="display:none"></div>
        </div>
    </div>
    <script>
        const q = new URLSearchParams(location.search);
        const token = q.get('token') || '';
        const kind = q.get('kind') === 'company' ? 'company' : 'admin';
        const slug = q.get('slug') || '';
        const msg = document.getElementById('msg');
        if (kind === 'admin') document.getElementById('context').textContent = 'Activate your CHC console account.';
        else document.getElementById('context').textContent = 'Activate your ordering account.';

        if (!token) { msg.className = 'msg err'; msg.textContent = 'This link is missing its token. Please use the link from your invite email.'; document.getElementById('form').style.display = 'none'; }

        function strong(pw) { return pw.length >= 8 && /[A-Z]/.test(pw) && /[a-z]/.test(pw) && /[0-9]/.test(pw); }

        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.className = 'msg'; msg.textContent = '';
            const pw = document.getElementById('pw').value;
            const pw2 = document.getElementById('pw2').value;
            if (pw !== pw2) { msg.className = 'msg err'; msg.textContent = 'The two passwords do not match.'; return; }
            if (!strong(pw)) { msg.className = 'msg err'; msg.textContent = 'Password must be at least 8 characters with uppercase, lowercase, and a number.'; return; }
            const btn = document.getElementById('submit'); btn.disabled = true;
            try {
                const endpoint = kind === 'admin' ? '/api/auth/admin-accept-invite' : '/api/auth/company-accept-invite';
                const resp = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password: pw }) });
                const data = await resp.json();
                if (!resp.ok) { msg.className = 'msg err'; msg.textContent = data.error || 'Could not set your password.'; btn.disabled = false; return; }

                // Auto sign-in by seeding the app's session, then redirect.
                if (kind === 'admin') {
                    sessionStorage.setItem('chc_admin_token', data.token);
                    sessionStorage.setItem('chc_admin_user', JSON.stringify(data.admin));
                    finish('/admin', 'the CHC console');
                } else {
                    sessionStorage.setItem('chc_token', data.token);
                    sessionStorage.setItem('chc_company', JSON.stringify(data.company));
                    const dest = '/store/' + (data.company?.slug || slug);
                    finish(dest, (data.company?.name || 'the store'));
                }
            } catch (err) { msg.className = 'msg err'; msg.textContent = 'Connection error. Please try again.'; btn.disabled = false; }
        });

        function finish(dest, label) {
            document.getElementById('form').style.display = 'none';
            msg.className = 'msg ok';
            msg.textContent = 'Password set. Signing you in…';
            setTimeout(() => { location.href = dest; }, 900);
            const done = document.getElementById('done');
            done.style.display = 'block';
            done.innerHTML = '<a class="btn" href="' + dest + '">Continue to ' + label + ' →</a>';
        }
    </script>
</body>
</html>
